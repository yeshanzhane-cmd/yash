<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — MOMO Store</title>
  <meta name="description" content="Your MOMO Store cart.">
  <meta name="robots" content="noindex">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%0A%3Cstop%20offset%3D%220%22%20stop-color%3D%22%2322C3E6%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%232F6BFF%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%0A%3Cpath%20d%3D%22M32%203%20L57%2017.5%20V46.5%20L32%2061%20L7%2046.5%20V17.5%20Z%22%20fill%3D%22url(%23g)%22%2F%3E%0A%3Cpath%20d%3D%22M32%209%20L52%2020.5%20V43.5%20L32%2055%20L12%2043.5%20V20.5%20Z%22%20fill%3D%22%23FFFFFF%22%2F%3E%0A%3Ctext%20x%3D%2232%22%20y%3D%2240%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%20Black%2C%20Arial%2C%20sans-serif%22%20font-size%3D%2222%22%20font-weight%3D%22900%22%20fill%3D%22%2312303C%22%3EM%3C%2Ftext%3E%0A%3C%2Fsvg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/store.css">
</head>
<body>

  <nav class="nav" aria-label="Primary">
    <div class="wrap nav__inner">
      <a class="wordmark" href="index.html">MOMO <em>Store</em></a>
      <ul class="nav__links">
        <li><a href="shop.html">Shop</a></li>
        <li><a href="builder.html">CV Builder</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="support.html">Support</a></li>
        <li><a href="account.html">Account</a></li>
      </ul>
      <div class="nav__actions">
        <a class="cart-btn" href="account.html" aria-label="Account">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </a>
        <a class="cart-btn" href="cart.html" aria-label="Cart">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
          <span class="badge" id="cart-badge" hidden>0</span>
        </a>
        <a class="btn nav__shop" href="shop.html">Shop</a>
      </div>
    </div>
  </nav>

  <main class="cart-page">
    <div class="wrap">
      <header class="page-head" style="padding: 0 0 48px;">
        <span class="eyebrow">Your selection</span>
        <h1>Cart</h1>
      </header>
      <div id="cart-root"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap">
      <div class="footer__base" style="border-top: 1px solid var(--hairline);">
        <span>© 2026 MOMO Store. All rights reserved.</span>
        <span>Made by creators, for creators.</span>
      </div>
    </div>
  </footer>

  <script src="assets/js/products.js" defer></script>
  <script src="assets/js/cart.js" defer></script>
  <script src="assets/js/ui.js" defer></script>
  <script defer>
    document.addEventListener('DOMContentLoaded', () => {
      const root = document.getElementById('cart-root');

      function render() {
        const lines = Cart.lines();

        if (lines.length === 0) {
          root.innerHTML = `
            <div class="empty-state">
              <h2>Your cart is empty</h2>
              <p>Your next role starts with the right template — it takes two minutes to pick one.</p>
              <a class="btn btn--accent" href="shop.html">Browse products</a>
            </div>`;
          return;
        }

        const subtotal = Cart.subtotal();
        root.innerHTML = `
          <div class="cart-layout">
            <ul class="cart-lines">
              ${lines.map(({ product, qty, total }) => `
                <li class="cart-line" data-id="${product.id}">
                  <a class="cart-line__art" href="product.html?id=${product.id}" aria-hidden="true" tabindex="-1">
                    ${artHTML(product.art)}
                  </a>
                  <div class="cart-line__meta">
                    <a href="product.html?id=${product.id}">${product.name}</a>
                    <span class="card__cat">${product.category} · ${money.format(product.price)} each</span>
                    <div class="cart-line__controls">
                      <div class="qty" aria-label="Quantity for ${product.name}">
                        <button type="button" data-action="dec" aria-label="Decrease quantity of ${product.name}">−</button>
                        <output aria-live="polite">${qty}</output>
                        <button type="button" data-action="inc" aria-label="Increase quantity of ${product.name}">+</button>
                      </div>
                      <button type="button" class="remove-btn" data-action="remove">Remove</button>
                    </div>
                  </div>
                  <span class="cart-line__price">${money.format(total)}</span>
                </li>`).join('')}
            </ul>
            <aside class="summary" aria-label="Order summary">
              <h2>Summary</h2>
              <dl>
                <dt>Subtotal</dt><dd>${money.format(subtotal)}</dd>
                <dt>Delivery</dt><dd>Instant download</dd>
                <dt class="total">Total</dt><dd>${money.format(subtotal)}</dd>
              </dl>
              <a class="btn btn--accent" href="checkout.html">Proceed to checkout</a>
              <p class="fine">Templates are delivered by email the moment your order completes.</p>
            </aside>
          </div>`;
      }

      root.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;
        const id = btn.closest('.cart-line').dataset.id;
        const current = Cart.read()[id] || 0;
        if (btn.dataset.action === 'inc') Cart.setQty(id, current + 1);
        if (btn.dataset.action === 'dec') Cart.setQty(id, current - 1);
        if (btn.dataset.action === 'remove') Cart.remove(id);
        render();
      });

      render();
    });
  </script>
</body>
</html>
